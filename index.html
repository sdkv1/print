<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Print RPP20N">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Print RPP20N">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <title>NOMOR ANTRIAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Inter', sans-serif;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
        }
        .sidebar {
            width: 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            gap: 1.5rem;
        }
        .service-btn {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 16/10;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .service-btn:active { transform: scale(0.97); }
        .service-btn .icon { font-size: 2.5rem; }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
        .btn-orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
        .content-area {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        .title-main {
            font-size: 3.5rem;
            font-weight: 900;
            color: #1f2937;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }
        .title-main span { color: #2563eb; }
        .title-sub {
            font-size: 1.8rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 0.25rem;
        }
        .title-hint {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 500;
        }
        .top-bar {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            right: env(safe-area-inset-right, 0);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            z-index: 100;
        }
        .clock { font-size: 0.85rem; font-weight: 600; color: #6b7280; }
        .btn-icon {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-icon:active { transform: scale(0.95); }
        @media (orientation: portrait) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 60%; flex-direction: row; padding: 1rem; }
            .content-area { width: 100%; height: 40%; }
            .service-btn { max-width: none; aspect-ratio: 3/4; font-size: 1rem; writing-mode: horizontal-tb; }
            .title-main { font-size: 2.2rem; }
            .title-sub { font-size: 1.2rem; }
        }
        @media (max-height: 500px) {
            .service-btn { font-size: 1.1rem; border-radius: 16px; }
            .title-main { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span id="clock" class="clock">00:00:00</span>
        <button class="btn-icon" onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <button class="service-btn btn-blue" onclick="printAntrian('SERVICE BARU')">
                <span class="icon">⚙️</span>
                <span>SERVICE BARU</span>
            </button>
            <button class="service-btn btn-green" onclick="printAntrian('PENGAMBILAN')">
                <span class="icon">📦</span>
                <span>PENGAMBILAN</span>
            </button>
            <button class="service-btn btn-orange" onclick="printAntrian('KLAIM GARANSI')">
                <span class="icon">🛡️</span>
                <span>KLAIM GARANSI</span>
            </button>
        </div>
        <div class="content-area">
            <div class="title-main">NOMOR<br><span>ANTRIAN</span></div>
            <div class="title-sub">SILAHKAN PILIH LAYANAN</div>
            <div class="title-hint">SENTUH TOMBOL UNTUK MENCETAK NOMOR ANTRIAN</div>
        </div>
    </div>

<script>
const APP_VERSION = '2.5.0';
let device = null;
let server = null;
let characteristic = null;
const PRINTER_SERVICE_UUID = '000018f0-0000-1000-8000-00805f9b34fb';
const PRINTER_CHARACTERISTIC_UUID = '00002af1-0000-1000-8000-00805f9b34fb';

// Clock
function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// Fullscreen
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
    } else {
        document.exitFullscreen().catch(()=>{});
    }
}

// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ESC/POS
function textEncoder(t){return new TextEncoder().encode(t);}
function escInit(){return new Uint8Array([0x1B,0x40]);}
function escAlign(a){return new Uint8Array([0x1B,0x61,a]);}
function escBold(o){return new Uint8Array([0x1B,0x45,o?1:0]);}
function escFontSize(dw,dh){const s=(dh?0x10:0x00)|(dw?0x20:0x00);return new Uint8Array([0x1D,0x21,s]);}
function escFeed(l){return new Uint8Array([0x1B,0x64,l]);}
function escCut(){return new Uint8Array([0x1D,0x56,0x00]);}

async function sendData(data){
    if(!characteristic)return;
    try{
        if(characteristic.writeValueWithoutResponse)await characteristic.writeValueWithoutResponse(data);
        else await characteristic.writeValue(data);
    }catch(e){console.log(e);}
}

async function printAntrian(layanan){
    if(!characteristic){
        alert('Printer belum terhubung. Klik OK untuk scan printer.');
        await connectPrinter();
        if(!characteristic)return;
    }
    const no = Math.floor(Math.random()*900)+100;
    const now=new Date();
    const tgl=now.toLocaleDateString('id-ID');
    const jam=now.toLocaleTimeString('id-ID',{hour12:false});

    const chunks=[];
    chunks.push(escInit());
    chunks.push(escAlign(1));
    chunks.push(escBold(1));
    chunks.push(escFontSize(1,1));
    chunks.push(textEncoder("NOMOR ANTRIAN\n"));
    chunks.push(escFontSize(0,0));
    chunks.push(escBold(0));
    chunks.push(textEncoder("==================\n"));
    chunks.push(escFontSize(1,1));
    chunks.push(textEncoder(no+"\n"));
    chunks.push(escFontSize(0,0));
    chunks.push(textEncoder("==================\n"));
    chunks.push(escAlign(0));
    chunks.push(textEncoder("Layanan: "+layanan+"\n"));
    chunks.push(textEncoder("Tgl: "+tgl+"\n"));
    chunks.push(textEncoder("Jam: "+jam+"\n"));
    chunks.push(textEncoder("\n"));
    chunks.push(escAlign(1));
    chunks.push(textEncoder("Terima kasih!\n"));
    chunks.push(textEncoder("Silahkan menunggu\n"));
    chunks.push(textEncoder("\n\n\n"));
    chunks.push(escFeed(3));
    chunks.push(escCut());

    for(const c of chunks){
        await sendData(c);
        await new Promise(r=>setTimeout(r,30));
    }
}

async function connectPrinter(){
    if(!navigator.bluetooth){alert('Browser tidak support Bluetooth');return;}
    try{
        device=await navigator.bluetooth.requestDevice({
            filters:[{namePrefix:'RPP20'},{namePrefix:'RPP20N'},{namePrefix:'Printer'},{services:[PRINTER_SERVICE_UUID]}],
            optionalServices:[PRINTER_SERVICE_UUID]
        });
        server=await device.gatt.connect();
        const service=await server.getPrimaryService(PRINTER_SERVICE_UUID);
        characteristic=await service.getCharacteristic(PRINTER_CHARACTERISTIC_UUID);
        alert('Printer terhubung: '+device.name);
    }catch(e){alert('Gagal: '+e.message);}
}

console.log('Print RPP20N v'+APP_VERSION);
</script>
</body>
</html>
